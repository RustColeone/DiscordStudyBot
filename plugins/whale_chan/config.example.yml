# Copy to config.yml in this folder: `cp config.example.yml config.yml && chmod 600 config.yml`.
# config.yml is git-ignored (also by this folder's own .gitignore, in case the folder is its own repository).
# Settings under extension_config.whale_chan in core.yml override this file.

# The Discord bot: create an application at https://discord.com/developers/applications, add a bot,
# enable "Message Content Intent" and invite it. Its token is read from this environment variable:
token_env: DISCORD_BOT_TOKEN_WHALE_CHAN
# Or, if you prefer not to edit .env, put the token here instead. Then keep this file private
# (chmod 600) and never share or copy this folder together with its config.yml.
# token: "your-bot-token"
# interface: whale_chan        # conversations are whale_chan:dm:<user> or whale_chan:<channel>

# She is the DeepSeek student: her prompt, name (and the alias 鲸酱) and models are in extensions/students/deepseek/,
# her memory and mood the students module's (extensions/students/config.yml), the same as every student's.
# persona: deepseek             # the student her bot speaks as
# new_chat_text: "🐳 好的主人，新的对话开始啦～"   # the reply to /new

# Her chats are MomoChat's, as a chat app (short and casual, only the answer posted): one ongoing thread per
# conversation, /new starts a fresh one. These are the options her bot's assignment gives MomoChat.
# style: chat                   # full: a chat client, complete answers
# effort: none                  # she answers at once (student.yml); low | medium | high think first, and take longer
max_steps: 10                   # tool steps per message
max_tokens: 8000
history_limit: 60               # messages of the current thread sent as context
history_chars: 40000            # and at most this many characters of them

# Tools as her model's own function calls where it can make them (DeepSeek, OpenAI); false: JSON steps only.
# tool_calls: true

# Speaking up: now and then she messages you first (a local dice roll every 30 minutes; a model is only
# called when it hits). Off until you turn it on; then it starts as a dry run that only writes down what it
# would have done. The owner steers it with /speakup (status, rehearse, now, on, off, dry).
# speak_up:
#   enabled: false
#   dry_run: true
#   timezone: Asia/Shanghai       # for quiet and peak hours; default: this machine's
#   every_min: 30
#   cooldown_min: 20              # not within this long of her own last message
#   peak: 20                      # hit line in % on weekdays 09-12 and 14-18 (you are busy)
#   off_peak: 60                  # and at other times
#   quiet: [1, 8]                 # never from 01:00 to 08:00 ([0, 0] turns this off)
#   bonus: 10                     # each miss adds this to the next line…
#   bonus_cap: 40                 # …up to this
#   max_unanswered: 1             # wait for your answer before speaking up again
#   people: []                    # Discord user ids; default: the bot's owners
#   call_them: 主人

# Her voice: short replies as Discord voice messages, in her own speak-ups and in chats switched on with
# /voice on; models can also send one (whale_chan.speak). OpenAI speech by default (OPENAI_API_KEY).
# voice:
#   enabled: true
#   model: gpt-4o-mini-tts
#   voice: coral                  # also shimmer, nova, sage, …
#   instructions: "A cute, playful, slightly tsundere young girl …"
#   speak_up: true                # her own first messages come as voice messages too
#   max_chars: 400                # longer replies stay text
#   backend: openai               # or cloned, or piper: a local voice, optional (voice_piper.py; not installed by default)
#   piper: {model: /path/to/zh_CN-huayan-medium.onnx}
#
# backend: cloned speaks in the voice of a short clip, through OpenRouter (OPENROUTER_API_KEY; needs ffmpeg). Her
# owner's 👍 or 👎 on a voice message files it with its text in the data folder's voice/good or voice/bad.
#   model: fish-audio/drama-3     # fast: about two seconds a sentence (fish-audio/s2.1-pro: as fast, less natural)
#   reference: voice-reference.wav   # in her data folder; keep it out of the repository, it is someone's voice
#   reference_text: ""            # what the clip says, if you know it; a wrong one is worse than none
#   patient:                      # her own first messages, where nobody waits: over the settings above
#     model: bytedance-seed/seed-audio-1-0   # the best sound, 20 to 70 seconds a sentence, about $0.03
#     reference: voice-reference-slow.wav

# Slash commands besides /new, /voice and /speakup (names from the core's catalog; [] for none).
# slash_commands: [help, memory, remind, reminders, routine, draw, search, read, video]

# Math rendering ($$…$$ as images): math, math_width_px, math_dpi, math_font_size_pt, math_min_height_px,
# math_max_images.
# math: true

# Extra assignment settings for this bot's conversations (core.yml assignments still win):
# assignment:
#   budget: {model_calls: 30, tool_calls: 24, seconds: 1800}
#   options: {owner_instructions: "…"}

# Permissions for her conversations (core.yml `permissions:` still wins, setting by setting). By default
# reads and prepares run, and every write and critical action asks you first with no exceptions:
# permissions:
#   "whale_chan:*":
#     use: ["*", "!system.*"]                 # what she may use at all
#     tiers: {write: always-ask, critical: always-ask}
