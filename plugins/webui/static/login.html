<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head>
<body class="login-body">
  <form class="login" method="post" action="/login">
    <div class="login-mark">✏️</div>
    <h1>{{title}}</h1>
    <p>Knock knock: what's the passphrase?</p>
    <input type="password" name="passphrase" autofocus autocomplete="current-password" aria-label="Passphrase">
    <button type="submit">Come in</button>
    <p class="login-error">{{error}}</p>
  </form>
</body>
</html>
