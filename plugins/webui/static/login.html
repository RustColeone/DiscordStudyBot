<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <title>{{title}}</title>
  <link rel="stylesheet" href="static/style.css">
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">
  <script defer src="static/i18n-zh.js"></script>
  <script defer src="static/i18n.js"></script>
</head>
<body class="login-body">
  <form class="login" method="post" action="login">
    <div class="login-mark">✏️</div>
    <h1>{{title}}</h1>
    <p>Knock knock: what's the passphrase?</p>
    <input type="password" name="passphrase" autofocus autocomplete="current-password" aria-label="Passphrase">
    <button type="submit">Come in</button>
    <p class="login-error">{{error}}</p>
  </form>
  <p class="credit">Icon art by <a href="https://www.pixiv.net/artworks/148186519" target="_blank"
     rel="noopener">ZipZipPipe</a> ·
    <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a></p>
</body>
</html>
