<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Students · {{title}}</title>
  <script src="static/prefs.js"></script>
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="static/students.css">
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.ico">
  <script defer src="static/i18n-zh.js"></script>
  <script defer src="static/i18n.js"></script>
  <script defer src="static/places.js"></script>
  <script defer src="static/students.js"></script>
</head>
<body class="students-body">
  <header class="site-header">
    <span class="site-brand"><span class="site-name">ChimeraArchive</span><span class="site-page"></span></span>
    <nav class="places-nav" id="places-nav" aria-label="Places" hidden></nav>
    <div class="site-end">
      <div class="stamina" id="stamina" role="group" aria-label="Stamina" hidden></div>
      <a class="user-tab" id="user-tab" hidden></a>
    </div>
  </header>
  <main class="students" id="students-main"></main>
  <div class="students-toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="application/json" id="students-data">{{data}}</script>
</body>
</html>
