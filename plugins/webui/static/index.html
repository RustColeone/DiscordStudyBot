<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
        integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
          integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
          crossorigin="anonymous"></script>
  <script defer src="/static/markdown.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Chats">
      <div class="brand">
        <span class="brand-mark">✏️</span>
        <span class="brand-name" id="brand">{{title}}</span>
        <button class="icon-button only-narrow" id="close-sidebar" type="button" aria-label="Close">✕</button>
      </div>
      <button class="new-chat" id="new-chat" type="button">＋ New chat</button>
      <nav class="chats" id="chats"></nav>
      <div class="me" id="me"></div>
    </aside>

    <main class="room">
      <header class="topbar">
        <button class="icon-button only-narrow" id="toggle-sidebar" type="button" aria-label="Chats">☰</button>
        <div class="chat-title" id="chat-title" title="Rename">Classroom</div>
        <div class="connection" id="connection" aria-live="polite"></div>
        <button class="icon-button members-button" id="toggle-members" type="button" aria-label="Classmates"
                aria-pressed="false" title="Classmates">👥</button>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty" id="empty">
          <div class="empty-wave">👋</div>
          <div class="empty-title">Everyone's here.</div>
          <div class="empty-text">Say hello, <kbd>@</kbd> someone, or drop a file in. Type <kbd>$</kbd> for commands.</div>
        </div>
      </section>

      <div class="typing" id="typing"></div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="palette" id="palette" role="listbox" hidden></div>
        <div class="attachments" id="attachments"></div>
        <div class="composer-row">
          <label class="icon-button attach" title="Attach files">
            📎<input type="file" id="file-input" multiple hidden>
          </label>
          <textarea id="input" rows="1" placeholder="Message the class…" aria-label="Message"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send">➤</button>
        </div>
      </form>
    </main>

    <aside class="members" id="members" aria-label="Classmates">
      <div class="members-head">
        <span id="members-title">In class</span>
        <button class="icon-button only-narrow" id="close-members" type="button" aria-label="Close">✕</button>
      </div>
      <div class="member-list" id="member-list"></div>
    </aside>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="menu" id="chat-menu" role="menu" hidden></div>
  <div class="viewer" id="viewer" hidden><img alt=""></div>
</body>
</html>
