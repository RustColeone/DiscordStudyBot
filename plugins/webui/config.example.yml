# Web UI settings. Copy to config.yml in this folder (git-ignored); extension_config.webui in core.yml
# overrides it.

port: 4156                      # open http://<this computer's address>:4156
# host: 0.0.0.0                 # listen on every network interface (127.0.0.1: this computer only)
# user_name: Leo                # your name in the chat (default: your login name)
# title: Study Room

# Whoever opens the page acts as the bot's creator. It only answers the local network (private and
# link-local addresses); a passphrase, asked once per browser, also keeps out others on your Wi-Fi.
# Prefer WEBUI_PASSPHRASE in .env; if you put it here, `chmod 600 config.yml`.
# passphrase: "a long phrase"
# networks: [10.0.0.0/24, 100.64.0.0/10]   # only these networks instead (e.g. add Tailscale)
# hostnames: [studybot.home]               # extra names this computer is reached by (IPs, localhost
                                           # and *.local, *.lan, *.home.arpa always work)
# Through a reverse proxy on this machine (nginx serving https://example.net/chat/), see the README:
# remote_access: true                      # clients beyond the local network, via the proxy, with a passphrase
# trusted_proxies: [127.0.0.1, ::1]        # whose X-Forwarded-For / X-Forwarded-Proto are believed

# Who answers: by default the shared room's five classmates (the room engine). The new-chat picker offers
# these; a chat with some of them (one: a direct message) gets its own assignment, removed with the chat.
# personas: [gpt, gemini, claude, deepseek, grok]
# classmates: [GPT, Gemini, Claude, DeepSeek, Grok]    # names of your own for them (default: the students')
# assignment:
#   budget: {model_calls: 40, tool_calls: 24, seconds: 900}
#   options:                    # the room's options here (these are the web UI's defaults)
#     history_limit: 40         # messages read word for word; older ones go into the chat's summary
#     compact: true
#     chime_in: true            # a message naming no one: one answers, the others may join in
#     diary_scope: webui        # classmates remember you across every web chat (notes stay filed per chat)

# max_upload_mb: 50
# max_text_chars: 20000          # longest message the page sends

# Rarely needed:
# interface: webui               # the interface's name, and so its addresses (webui:<chat>)
# passphrase_env: WEBUI_PASSPHRASE   # the .env variable holding the passphrase
# user_id: creator               # your sender ID in the core (owners are configured by it)

# The Classroom next door (the workbench module): a mini map in the sidebar shows who is in the Classroom and who
# waits at its door with an invitation; this server asks the Classroom on this machine every few seconds while a page
# is open.
# map: true                     # the mini map of the places other interfaces publish (the Classroom); false: none
# places_poll_s: 5
