# `venv/bin/python -m core setup` writes what it needs here for you; edit by hand for the rest.
# Optional overrides for `python -m core`. Without a core.yml the built-in defaults are used
# (core/defaults.py): every module, any model provider whose key is
# in .env, owner = the Discord application's owner. .env holds secrets only; settings go here or in a
# module's config.yml.
#
# Copy to core.yml and keep only what you change. Mappings merge with the defaults key by key;
# lists and plain values replace them. Paths are relative to this file. Secrets stay in .env.

# data_dir: data/core          # tank.db, gateway.db, workspaces/, extensions/, audit.log
# env_files: [.env]            # KEY=VALUE files; never override variables already set
# audit_echo: false            # also print audit events to stdout

# Modules: every folder with an extension.py loads, the built-in ones in extensions/ first, then the
# external ones in plugins/. Turn one off by folder (extensions/terminal) or by name (terminal), and
# add module folders that live elsewhere (they count as external). Built-in modules:
#   discord, momochat (conversations, direct and in groups), chimera (the students on your code: the Classroom,
#   :4157), basic, cli (stdin chat, for local testing), students (gpt, gemini, claude, deepseek, grok: one folder
#   each, and each one's memory of you, $alias, $bond; needs mneme-llm 0.2),
#   media ($video, $clip; yt-dlp + ffmpeg), images ($draw), system ($status), reminders ($remind),
#   web ($search, $read, image search, maps, $wolfram with WOLFRAM_APPID), terminal (creator-only shell:
#   $t <line>, a terminal channel, or a MomoChat speaker with your approval; docs/core/EXTENSIONS.md),
#   host (creator-only $screenshot, $getfile, $savefile, $clipboard, $copy, $open, $processes).
# External ones here: whale_chan (鲸酱), wechat (dormant until extension_config.wechat is set; docs/WECHAT.md).
# modules:
#   exclude: [extensions/terminal, whale_chan]
#   paths: [../AudioManager/bot_extension]
#
# Module settings live with the module: copy its config.example.yml to config.yml (git-ignored) next
# to it, e.g. extensions/discord/config.yml. This file holds what is shared (owners, models, agents,
# admission, assignments); a module's settings repeated here, under extension_config, override its own:
# extension_config:
#   discord: {thread_channels: ["123456789012345678"]}

# Owners per interface (sender IDs). Default: the Discord application's owner (or DISCORD_OWNER_ID, the
# older way).
# owners:
#   discord: ["123456789012345678"]
#   cli: [local]

# Where approvals (other than those you start in your own direct chat with a bot, which come back
# there), failure details and interface events go. Default: the Discord owner's DM.
# control: "discord:dm:123456789012345678"

# Provider settings merge over the defaults (inline_history, on for DeepSeek, writes a JSON request's
# earlier turns into one message, since DeepSeek's JSON mode answers blank after one), e.g. a provider
# whose models cannot see images (tried last when a request has images), a minimum gap between requests,
# or what `$model` offers: models released since a date, minus IDs matching an exclude pattern, and (with
# an allow list) only IDs matching one of it; patterns are regular expressions, case-insensitive, so plain
# words work. A list here replaces the built-in one. Only the models offered can be chosen.
# providers:
#   openrouter: {vision: false}
#   gemini: {min_interval_s: 1.1, models_allow: ['^gemini-3\.8-flash$']}
#   claude: {models_exclude: [fable, opus]}

# Model prices (every answer carries its price and cost; the pages show them, stamina counts them): Artificial
# Analysis's free list (a free key from artificialanalysis.ai in .env; credited wherever it is shown, as its terms
# ask), fetched again once a day old, under your own figures. A model is matched by name (exact, the same words in
# another order, else the one closest of the same maker); two equally close leave it unpriced: name one in `aliases`.
# prices:
#   key_env: ARTIFICIAL_ANALYSIS_API_KEY
#   models: {deepseek/deepseek-flash: {input: 0.07, output: 0.28, cache_hit: 0.007}, mylocal: {input: 0, output: 0}}
#   aliases: {deepseek/deepseek-flash: deepseek-v4-flash}
#   max_age_h: 24

# Stamina: what each persona may spend a day (dollars at list price); a run that reaches it stops and asks you
# before spending more (approve: she may spend `step` more today). Its account: a balance its provider reports
# (DeepSeek's, asked with the same key) or a budget you enter, counting down from what is spent since `since`.
# stamina:
#   allowance: 0.50                 # each persona's day (0: no daily limit); `personas: {grok: 1.00}` for one
#   step: 0.50                      # what one approval adds
#   timezone: Asia/Shanghai         # when the day starts (default: this machine's)
#   accounts:
#     deepseek: {balance: true}
#     openai: {budget: 10.00, since: "2026-10-28"}

# Model profiles: ordered candidates; candidates without an API key are skipped.
# A candidate may override `vision`, `effort` or `max_tokens`.
# profiles:
#   default:
#     - {provider: deepseek, model: deepseek-flash}
#     - {provider: openai, model: gpt-6-luna}

# Agents: a persona with her models and nothing else (no memory of anyone; a student is the students module's
# agent with her memory). `personas:` is this section's name before 2026-10-27, still read.
# agents:
#   helper:          # an agent of your own, in one entry
#     display_name: Helper
#     prompt: "You are a careful helper. Answer briefly."
#     models: [deepseek/deepseek-flash, openai/gpt-6-luna]   # a profile of her name (or `profile: default`)
#     description: "Helper, a careful assistant"            # optional: one line, for engines that write their own
#   assistant:       # the core's own agent
#     display_name: Assistant
#     profile: default
#     prompt: |
#       You are a helpful, concise assistant for a small private server.
#     # Prompt parts: its personality, house rules... (docs/core/EXTENSIONS.md, "Prompt parts"). A file is
#     # relative to this file's folder and re-read every turn; `place: turn` puts a part after the history.
#     parts:
#       - {name: personality, file: personas/assistant.md}
#   gpt:             # a module's persona (a student): no `prompt`, so these parts are added to hers
#     parts:
#       - {name: personality, file: personas/gpt.md}
#       - {name: season, text: "It is exam season.", place: turn}

# Which engine and personas handle a conversation, and its budget.
# Most specific pattern wins: "interface:conversation", then "interface:*", then "*".
# assignments:
#   "*":
#     engine: momochat        # (engine: assistant, room or chat, its names before, still reach it)
#     personas: [assistant]
#     budget: {model_calls: 24, tool_calls: 24, seconds: 900}
#     lane: conversation      # or sender: members of a group are handled independently
#     options: {instructions: "Keep replies short."}   # extensions/momochat/README.md lists them all
#     # owner_instructions: private text added only when an owner speaks; max_steps: per-speaker step limit
#   "discord:123456789012345678":   # a server channel
#     engine: momochat
#     persona: assistant
#     enabled: false          # record messages, never answer
#   "discord:234567890123456789":   # a group chat with the five students
#     engine: momochat
#     personas: [gpt, gemini, claude, deepseek, grok]    # this order is also the rotation order
#     budget: {model_calls: 40, tool_calls: 24, seconds: 900}
#     options: {chime_in: true}

# Permissions: what a conversation may use (use), what runs there without asking per tier (tiers:
# read, prepare, write, critical → auto | ask | always-ask; critical never auto) and exceptions per
# capability (rules → auto | ask, optionally per level). Per setting, the most specific pattern wins;
# modules may suggest their own (鲸酱 always asks before writes). By default reads and prepares run,
# writes and critical actions ask, and anyone may use the basic features (reminders, music, the study
# clock, their own routines) without asking. `$permissions` shows what applies; see
# docs/core/ARCHITECTURE.md, Permissions.
# permissions:
#   "wechat:*":
#     use: ["*", "!system.*"]
#     tiers: {write: always-ask}
#   "discord:dm:123456789012345678":
#     rules: {"services.restart(navidrome.service)": {creator: auto}}

# Files models may never read, besides the built-in list (.env, keys, SSH and cloud credentials, cookie
# stores, modules' config.yml, the core's databases):
# secrets: ["~/Projects/AudioManager/music_manager.toml"]

# Gateway admission rules. In servers the bot answers mentions and replies to its messages.
# admission:
#   "*": {enabled: true, require_mention_in_groups: true}
#   "discord:123456789012345678": {require_mention_in_groups: false}   # answer everything here

# Reply routes, owner forwards and routines are usually edited at runtime with $call core.set_route,
# core.set_forward and core.set_routine; they can also be given here.
# routes:
#   "routine:*": {target: "discord:dm:123456789012345678"}
# routines:
#   morning: {daily_at: "08:00", text: "Tell me today's date."}
