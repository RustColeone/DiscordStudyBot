# Optional overrides for `python -m core`. Without a core.yml the built-in defaults are used
# (core/defaults.py): every module, any model provider whose key is
# in .env, owner = DISCORD_OWNER_ID or else the Discord application's owner.
#
# Copy to core.yml and keep only what you change. Mappings merge with the defaults key by key;
# lists and plain values replace them. Paths are relative to this file. Secrets stay in .env.

# data_dir: data/core          # tank.db, gateway.db, workspaces/, extensions/, audit.log
# env_files: [.env]            # KEY=VALUE files; never override variables already set
# audit_echo: false            # also print audit events to stdout

# Modules: every folder with an extension.py loads, the built-in ones in extensions/ first, then the
# external ones in plugins/. Turn one off by folder (extensions/terminal) or by name (terminal), and
# add module folders that live elsewhere (they count as external). Built-in modules:
#   discord, assistant, basic, cli (stdin chat, for local testing), room (luna, gemini, claude, deepseek),
#   media ($video, $clip; yt-dlp + ffmpeg), images ($draw), system ($status), reminders ($remind),
#   web ($search, $read, image search, maps, $wolfram with WOLFRAM_APPID), terminal (creator-only shell:
#   $t <line>, a terminal channel, or the assistant with your approval; docs/core/EXTENSIONS.md).
# External ones here: whale_chan (鲸酱), wechat (dormant until extension_config.wechat is set; docs/WECHAT.md).
# modules:
#   exclude: [extensions/terminal, extensions/cli]
#   paths: [../AudioManager/bot_extension]
#
# Each module folder may keep a git-ignored config.yml; extension_config below overrides it.

# extension_config:
#   discord: {token_env: [DISCORD_BOT_TOKEN, DISCORD_TOKEN, TOKEN], attachment_max_mb: 25,
#             music_dir: /path/to/music, music_list: /path/to/musicList.txt,   # $music (needs ffmpeg, libopus)
#             clock_interval_s: 1, math: true,   # live $start clock; render $$math$$ as images
#             talk_prefixes: ["$agent", "$chat"],   # "$agent hi" counts as addressing the bot
#             thread_channels: ["123456789012345678"],   # tasks asked here get their own thread
#             slash_commands: true}   # register the commands as Discord slash commands
#   assistant: {max_steps: 8, history_limit: 16, effort: low}
#   images: {default_provider: gemini, gemini_model: gemini-2.5-flash-image, openai_model: gpt-image-2.5-sunburst}
#   media: {keep_dir: clips}     # --keep-file copies (relative to data/core/extensions/media)
#   web: {grounding: true, grounding_model: gemini-3.8-flash, searxng_url: ""}   # or SEARXNG_URL in .env
#   cli: {conversation: local, user: local, user_name: you}

# Owners per interface (sender IDs). Default: DISCORD_OWNER_ID, else the Discord application owner.
# owners:
#   discord: ["123456789012345678"]
#   cli: [local]

# Where approvals, failure details and interface events go. Default: the Discord owner's DM.
# control: "discord:dm:123456789012345678"

# Provider settings merge over the defaults, e.g. a provider whose models cannot see images
# (tried last when a request has images) or a minimum gap between requests:
# providers:
#   openrouter: {vision: false}
#   gemini: {min_interval_s: 1.1}

# Model profiles: ordered candidates; candidates without an API key are skipped.
# A candidate may override `vision`, `effort` or `max_tokens`.
# profiles:
#   default:
#     - {provider: deepseek, model: deepseek-flash}
#     - {provider: openai, model: gpt-6-luna}

# personas:
#   assistant:
#     display_name: Assistant
#     profile: default
#     prompt: |
#       You are a helpful, concise assistant for a small private server.

# Which engine and personas handle a conversation, what it may use and its budget.
# Most specific pattern wins: "interface:conversation", then "interface:*", then "*".
# assignments:
#   "*":
#     engine: assistant
#     personas: [assistant]
#     allow: ["*"]
#     preapprove: [reminders.create, reminders.cancel, discord.music, discord.music_control, discord.queue_music,
#                  discord.clock_start, discord.clock_stop]   # write capabilities that run without asking the owner
#     budget: {model_calls: 24, tool_calls: 24, seconds: 900}
#     lane: conversation      # or sender: members of a group are handled independently
#     options: {instructions: "Keep replies short.", diary: true}   # diary: persona notes about each person
#     # owner_instructions: private text added only when an owner speaks; max_steps: per-assignment step limit
#   "discord:123456789012345678":   # a server channel
#     engine: assistant
#     persona: assistant
#     enabled: false          # record messages, never answer
#   "discord:234567890123456789":   # the shared room: four characters on one work board
#     engine: room
#     personas: [luna, gemini, claude, deepseek]   # this order is also the rotation order
#     budget: {model_calls: 40, tool_calls: 24, seconds: 900}

# Gateway admission rules. In servers the bot answers mentions and replies to its messages.
# admission:
#   "*": {enabled: true, require_mention_in_groups: true}
#   "discord:123456789012345678": {require_mention_in_groups: false}   # answer everything here

# Reply routes, owner forwards and routines are usually edited at runtime with $call core.set_route,
# core.set_forward and core.set_routine; they can also be given here.
# routes:
#   "routine:*": {target: "discord:dm:123456789012345678"}
# routines:
#   morning: {daily_at: "08:00", text: "Tell me today's date."}
