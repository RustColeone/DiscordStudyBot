# Example configuration file
# Copy this to config.yml and fill in your values
# Or set these as environment variables (recommended for security)

# Discord Bot Settings
TOKEN: your_discord_bot_token_here
ID_CHANNEL: your_channel_id_here
ID_CHANNEL1: your_channel1_id_here
ID_MESSAGE: your_message_id_here
ID_VOICECHANNEL: your_voice_channel_id_here
# Optional comma-separated command channel IDs. Empty allows every accessible channel.
DISCORD_ALLOWED_CHANNELS:
# Set true to require a bot mention. Defaults to false for normal replies in allowed channels.
DISCORD_REQUIRE_MENTION: false
# Optional creator lock. Use the immutable numeric Discord user ID, not a username.
CREATOR_USER_ID:
CREATOR_ONLY_MODE: false
# Private context injected only for authenticated creator chat requests.
CREATOR_PROMPT:
TIMEZONE: America/Los_Angeles
# Optional BCP-47 regional label for agent date/number interpretation; replies still follow the user.
AGENT_LOCALE: en-US
AGENT_WORK_MAX_STEPS: 24
AGENT_WORK_MAX_ACTIONS: 24

# Optional MCP servers. No tool is exposed unless it is explicitly allowlisted.
MCP_SERVERS: {}
# Example:
# MCP_SERVERS:
#   local_tools:
#     transport: stdio
#     command: /absolute/path/to/python
#     args: [/absolute/path/to/server.py]
#     allow_tools: [lookup]
#     risk:
#       lookup: read_only

# AI API Keys
OPENAI_API_KEY: your_openai_api_key_here
GEMINI_API_KEY: your_gemini_api_key_here
DEEPSEEK_API_KEY: your_deepseek_api_key_here

# Optional self-hosted SearXNG base URL. DuckDuckGo is used without a key when omitted.
SEARXNG_URL:
WOLFRAM_APPID: your_wolfram_app_id_here

# Local Paths
WOLFRAM_PATH: C:/Program Files/Wolfram Research/Wolfram Engine/13.2/WolframKernel.exe

# Discord-to-WeChat account bridge (native Linux desktop, separate from adapter mode)
BRIDGE_DEFAULT: example
# Defaults to CREATOR_USER_ID. Only this Discord user can inspect or control the account.
WECHAT_BRIDGE_OWNER_ID:
WECHAT_BRIDGE_DISPLAY: ':0'
WECHAT_BRIDGE_WAYLAND_DISPLAY: wayland-0
WECHAT_BRIDGE_PYTHON: /usr/bin/python3
WECHAT_BRIDGE_POLL_SECONDS: 5
# Local file budget, not a measured WeChat server limit.
WECHAT_BRIDGE_MAX_UPLOAD_MB: 100
# Model engine is independent of the DeepSeek character prompt. Use luna during an outage.
WECHAT_BRIDGE_REPLY_PROVIDER: deepseek
WECHAT_BRIDGE_REPLY_MODEL:
# Gather incoming bursts briefly; generation overlaps the outbound send cooldown.
WECHAT_BRIDGE_COALESCE_SECONDS: 1
# Native reads only: after a restart, route messages missed while stopped if newer than this (0 disables).
WECHAT_BRIDGE_CATCHUP_SECONDS: 900
# Native reads require validated local database keys; desktop still sends.
WECHAT_BRIDGE_READ_BACKEND: desktop
WECHAT_BRIDGE_DATABASE_ROOT:
WECHAT_BRIDGE_DATABASE_KEYS:

# WeChat Adapter Settings (Windows + local pywechat clone)
# WECHAT_CHAT is optional. If set, the adapter monitors that one chat directly.
# If omitted, the adapter scans unread chats globally.
# WECHAT_IDLE_CHAT is the known parking chat used after scans/sends so new messages in other chats stay unread.
# If WECHAT_WHITELIST is not empty and WECHAT_CHAT is empty, the adapter polls those chats directly instead of scanning all chats.
# WECHAT_BROADCAST_CHAT can be used as the target for $broadcast.
# WECHAT_MONITOR_SECONDS controls how often the adapter polls for new messages.
# WECHAT_WHITELIST is optional. If not empty, the bot only responds to those chat names.
WECHAT_CHAT: your_wechat_chat_name_here
WECHAT_IDLE_CHAT: File Transfer
WECHAT_BROADCAST_CHAT: your_wechat_broadcast_chat_name_here
WECHAT_MONITOR_SECONDS: 3
WECHAT_WHITELIST:
  - File Transfer
  - your_wechat_group_name_here
