# Workbench settings. Copy to config.yml in this folder (git-ignored); extension_config.workbench in core.yml
# overrides it inside the bot. Every key is optional.

# ---- the page ----------------------------------------------------------------------------------------------
# port: 4157                    # open http://<this computer>:4157
# host: 0.0.0.0                 # 127.0.0.1: this computer only
# title: Club Room
# user_name: Leo                # your name on your own messages (default: your login name)
# hostnames: [pi.home]          # extra names this computer is reached by (IPs, localhost, *.local always work)
# public_url: http://pi.home:4157   # the address links in Discord messages use (default: the one printed at start)
# web: true                     # false: no page (tasks from Discord only)

# ---- the classroom next door --------------------------------------------------------------------------------
# A classmate in the classroom (the web UI) can invite you here with workbench.invite; Report back sends the result to
# the chat it came from.
# classroom_url: http://192.168.1.20:4156/   # where "open the classroom" goes (default: this computer, port 4156)
# bring_messages: 16                         # how much of the chat comes along with an invitation
# visit_minutes: 30                          # a finished visit ends after this, if nobody reported back

# ---- projects: where the club may work ---------------------------------------------------------------------
# Each task works in its own git worktree of the project; your checkout is untouched until you land a change.
# test: a shell line run in the task's worktree ({checkout} = the project's folder, {python} = its venv's Python);
#       guessed from the files when left out (pytest, unittest, npm test, cargo test, go test, make test).
# link: git-ignored folders the worktree borrows from the checkout (a venv is borrowed by default).
# land: commit (one commit on the checkout's current branch, the default) or branch (it stays on its own branch).
# projects:
#   harness:
#     path: ~/Projects/temp_tests/harness
#     test: "{python} -m unittest discover -s tests -t ."
#   server-mgmt:
#     path: ~/Projects/server-mgmt
#     land: branch
# projects_dir: ~/Projects      # where "Start a new, empty project" makes folders (default: the data folder)
# sample: true                  # the practice project (a club's schedule tool with tests)
# default_project: harness      # for tasks that name none (Discord); else a lone project, else the practice one

# ---- the club: seats and roles -----------------------------------------------------------------------------
# A seat is a classmate: her family (reviewers come from another family than the drafter when one can answer),
# a line of character, and two model lists. Merged over the defaults key by key; `name: false` removes a seat.
# Models are provider/model; providers are the bot's (deepseek, openai, gemini, claude, grok) or your own below.
# team:
#   claude: {strong: [claude/claude-opus-5-5]}          # a stronger reviewer
#   deepseek: false
#   flash:                                               # one DeepSeek model as her own classmate
#     name: Flash-chan
#     family: deepseek
#     also: [deepseek]                                   # she leads when the classroom's DeepSeek invites you
#     avatar: deepseek                                   # the picture to use (avatars/<avatar>.png)
#     voice: "Flash-chan, the younger DeepSeek whale sister: quick and sharp"
#     cheap: [deepseek/deepseek-flash]
#     effort: high                                       # the most she thinks, whatever turn/review_effort ask
#     tool_calls: true                                   # work through the API's own function calls (OpenAI-
#                                                        # compatible providers), not one JSON object per turn
#   pro:
#     name: Pro-chan
#     family: deepseek
#     avatar: deepseek
#     voice: "Pro-chan, the elder DeepSeek whale sister: earnest and thorough"
#     cheap: [deepseek/deepseek-v4-pro]
#
# Who may take each role, most preferred first; the first who can answer takes it.
#   router: sorts the request and announces the plan     drafter: the cheap first draft
#   judge: the quick check in a cascade                  strong: takes over a draft that did not pass
#   critic: the review in a critique (no tools)
# roles:
#   router: [luna, claude, gemini, deepseek, grok]
#   drafter: [deepseek, gemini, grok, luna, claude]
#   judge: [gemini, luna, deepseek, claude, grok]
#   strong: [claude, luna, gemini, deepseek, grok]
#   critic: [claude, luna, gemini, deepseek, grok]
#   tester: [deepseek, gemini, grok, luna, claude]   # cheapest first; another company than the author goes first
#
# families: {openrouter: mixed}  # provider → family, for providers the defaults do not know
# providers:                     # extra or changed providers (used on its own; inside the bot core.yml's win)
#   mylocal: {kind: openai_compatible, base_url: "http://localhost:11434/v1", api_key_env: OLLAMA_KEY}

# ---- approvals and commands --------------------------------------------------------------------------------
# second_approval: true         # the checklist check before the final approval to land (testing; can go later)
# commands: allowlist           # shell lines that run without asking: allowlist (tests, linters, looking around),
#                               # ask (every line asks) or any (nothing asks)
# command_network: true         # false: the commands models run (run, probes, the tests) get no network (Linux)
# command_filesystem: all       # worktree: those commands see only the system (read-only), their worktree and the
#                               # project; no home or temp folders, no other processes (Linux, bubblewrap)
# allow: ["make fmt"]           # more lines allowed as written (by prefix)
# baseline: true                # run the tests before the first change too, so failures that were already
#                               # there are not blamed on the change

# ---- bounds ------------------------------------------------------------------------------------------------
# turns: {draft: 16, escalate: 16, revise: 10, single: 20, question: 12, followup: 14}   # turns per step
# turn_tokens: 8000             # a solver turn's output limit (write_file carries whole files)
# max_tokens_cap: 32000         # an answer cut off at the limit is asked again with twice the room (and low effort)
# turn_effort: medium           # a solver turn's reasoning effort (reasoning models count it in the output)
# turn_timeout_s: 420           # slow models need it for a big turn (writing files)
# review_tokens: 12000          # a review lists every criterion with its evidence
# review_effort: medium         # (reasoning models count their reasoning in the output)
# test_timeout_s: 900
# command_timeout_s: 600
# budget: {model_calls: 120, tool_calls: 400, seconds: 3600}   # per run, inside the bot

# ---- cost ----------------------------------------------------------------------------------------------------
# Prices come from Artificial Analysis's free models list (credited on the page, as their terms ask): put a free key
# from artificialanalysis.ai in .env as ARTIFICIAL_ANALYSIS_API_KEY. The list is fetched again on use once it is more
# than a day old; a failed fetch keeps the last list and tries again an hour later. Each answer is priced when it
# comes, so a later list never changes what a past step cost. Costs are list-price estimates (cache hits count at the
# full input price).
# prices_max_age_h: 24
# prices_key_env: ARTIFICIAL_ANALYSIS_API_KEY
#
# A model is matched by name (exact, the same words in another order, else the one closest model of the same maker).
# When two are equally close it is left unpriced and the club dialog lists the candidates: pick one here.
# price_aliases:
#   deepseek/deepseek-flash: deepseek-v4-flash
#
# Your own prices (dollars per million tokens) win over the list, by provider/model or by provider:
# prices:
#   deepseek/deepseek-flash: {input: 0.07, output: 0.28}
#   mylocal: {input: 0, output: 0}
