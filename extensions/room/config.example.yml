# Room engine settings. Copy to config.yml (git-ignored); extension_config.room in core.yml overrides it.
max_steps: 24
history_limit: 30               # earlier messages every character reads word for word (at most 150)
chime_in: false                 # a group message naming no one: whose turn it is answers, the others may join in
compact: true                   # fold messages older than history_limit into the chat's rolling summary
compact_every: 20               # ...once this many have scrolled out (one call to compact_profile)
compact_profile: default        # the model profile that writes the summary
# A conversation's assignment can set any of these in its `options`, and also `diary_scope` (a name: its
# characters' notes about a person are shared with every conversation using the same name).
max_tokens: 1500
aliases: {}                     # more names that call on a persona, beyond her own aliases

# The characters and their models are the students module's (extensions/students): its config.yml takes the
# `providers:` and `profiles:` this file used to hold.
