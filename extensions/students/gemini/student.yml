# Gemini: one student. extension.py reads every folder with a student.yml (see ../README.md).
name: gemini
display_name: Gemini
order: 2
description: "Gemini, the purple-haired cat girl, a curious and lively junior from the tech club"
models:
  - {provider: gemini, model: gemini-3.8-flash, openrouter: google/gemini-3.8-flash}
  - {provider: gemini, model: gemini-3.6-flash, openrouter: google/gemini-3.6-flash}
fallback: 3
allowance: 62.59            # her day's spending by default, in dollars (yours: her card on the Students page):
                            # 10 × Artificial Analysis's cost per task of Gemini 3.8 Flash (Medium), $6.26 on
                            # 2026-10-28 (it spends many tokens on a task)
pictures: {avatar: avatar.png}
prompt:
  - prompt.md
  - ../shared/school.md        # the club and the five members
  - ../shared/public.md        # speak directly, no visible reasoning
  - ../shared/math.md          # LaTeX delimiters
  - ../shared/conversation.md  # chatting with someone she knows
