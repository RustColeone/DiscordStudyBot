# Grok: one student. extension.py reads every folder with a student.yml (see ../README.md).
name: grok
display_name: Grok
order: 5
description: "Grok, the blonde vampire, a cocky and mischievous young lady"
models:
  - {provider: grok, model: grok-4-fast, openrouter: x-ai/grok-4.3}   # (OpenRouter has no Grok 4 Fast)
# No `fallback`: her model needs its own key, so it is no one else's fallback. Without the key, GPT's list answers.
falls_back_to: gpt
# No `allowance`: Artificial Analysis lists no cost per task for Grok 4 Fast (2026-10-28), so her day is the core's
# $0.50 (yours: her card on the Students page).
providers:                   # a provider she brings (the others are built into the core)
  grok:
    kind: openai_compatible  # xAI speaks the OpenAI API
    base_url: https://api.x.ai/v1
    api_key_env: GROK_API_KEY   # in .env; `python -m core setup` asks for it
    schema_mode: native
    effort_param: true
    # $model offers her recent language models (not grok-imagine's pictures and videos).
    models_since: '2026-06-01'
    models_exclude: [imagine]
pictures: {avatar: avatar.png}
prompt:
  - prompt.md
  - ../shared/school.md        # the club and the five members
  - ../shared/public.md        # speak directly, no visible reasoning
  - ../shared/math.md          # LaTeX delimiters
  - ../shared/conversation.md  # chatting with someone she knows
