# The students' art: drawn by `python tools/draw_students.py` with OpenAI's image model into each student's art/
# folder (WebP). The students module picks up every picture in art/ by its file name (art/stage-2.webp is her
# `stage-2`), so the pages show it at once. Tune a prompt here and draw that kind again:
# `python tools/draw_students.py --students claude --kinds stage-3 --force`.
#
# Every picture is drawn from her design sheet (`reference`: her whole look, from the AI-girl fan archive
# 蓝色大肥鱼.com) and her avatar.png (her face); a chibi also from the chibi reference below (the style and
# proportions only). A works page's address is enough: the tool downloads its original picture once into
# data/art-references/ (git-ignored: the archive lists these pictures' license as unknown, so they stay out of git).
#
# A prompt is the style, then her line (who she is), then the kind's own words. `{name}` is her display name,
# `{look}` her look and `{motif}` her motifs (below), `{role}` her place in the club.
model: gpt-image-2.5-sunburst
references:
  chibi: https://蓝色大肥鱼.com/works/deepseek202610210007.html   # a Q版 DeepSeek: every chibi follows its style
style: >-
  Japanese anime gacha-game character art of the girl in the reference pictures: the design sheet shows her whole
  look (hair, ears, horns, wings, tail, eyes, outfit colours and ornaments), the avatar her face. Keep every feature
  that makes her her ({look}) exactly as in them. Wholesome and modest: she is fully and neatly dressed, nothing
  revealing, no fan service. Clean lineart, soft cel shading, bright appealing colours, no text, no watermark, no
  logo.

students:
  gpt:
    reference: https://蓝色大肥鱼.com/works/gpt202610170004.html
    look: >-
      waist-length white hair, violet eyes, curved white dragon horns, pointed ears, pale lavender dragon wings, a
      long white scaled dragon tail, white flower crests with silver tassels
    motif: white dragons, moonlight and silver
    role: the calm, dependable student-council president
  gemini:
    reference: https://蓝色大肥鱼.com/works/gemini202610170002.html
    look: >-
      long wavy purple-to-blue gradient hair, purple cat ears with pink insides, a purple cat tail, odd eyes (one
      gold, one red), a four-pointed star hair ornament, navy and white clothes with star charms
    motif: twinkling four-pointed stars, gadgets and circuit patterns
    role: the curious, lively junior from the tech club
  claude:
    reference: https://蓝色大肥鱼.com/works/claude202610030001.html
    look: >-
      very long straight orange hair, calm amber eyes, a black ribbon and orange flower ornament in her hair, white,
      orange and black clothes embroidered with little sunflowers
    motif: sunflowers, books and warm autumn light
    role: the sharp-eyed, elegant disciplinary-committee member
  deepseek:
    reference: https://蓝色大肥鱼.com/works/deepseek202610170005.html
    look: >-
      long dark-blue hair fading to light blue at the tips, blue eyes, dark-blue whale-fin ears, a white frilled
      maid headdress with a small blue bow, a dark-blue whale tail; her own outfit is a navy-and-white maid dress
      with a white apron embroidered with a spouting whale
    motif: whales, the deep sea and bubbles
    role: the clever, lazy junior who naps whenever she can
  grok:
    reference: https://蓝色大肥鱼.com/works/grok202610170001.html
    look: >-
      long blonde twin tails, blue eyes, pointed ears, a small dark crown with little bat wings and a crescent moon,
      gothic black dress with white lace, gold trim and a dark-red lining; her weapon is a huge black-and-gold
      double-bladed battle axe with an X emblem
    motif: night, bats, gold and crimson
    role: the cocky, mischievous young lady

kinds:
  # The Cafe: a chibi walking about (transparent background, the whole figure). The chibi reference comes first:
  # its style and proportions, never its character (unless she is the one in it).
  chibi:
    size: 1024x1024
    quality: medium
    background: transparent
    reference: chibi
    prompt: >-
      A Q版 chibi of {name}, {role}, drawn exactly in the style of the chibi reference picture (the first one: copy
      its style and proportions only, not its character unless it is her): about two heads tall, a big round head
      with huge glossy eyes, a tiny soft body, standing facing forward, in her own outfit from her design sheet with
      her ears, horns, wings or tail as she has them, simple clean flat colours. Full body, on a transparent
      background with nothing else in the picture.

  # Her art stages: each a new, better illustration, more detailed at every stage (and drawn with more effort).
  stage-2:
    size: 1024x1536
    quality: low
    prompt: >-
      Stage 2 card art of {name}, {role}: a waist-up portrait in her school uniform, a gentle confident expression,
      a simple soft pastel background with a hint of {motif}.
  stage-3:
    size: 1024x1536
    quality: medium
    prompt: >-
      Stage 3 card art of {name}, {role}: a detailed knee-up illustration in an evolved version of her uniform with
      touches of {motif}, a dynamic pose, a background that fits her place in the club, warm rim light and richer
      textures in hair and cloth.
  stage-4:
    size: 1024x1536
    quality: high
    prompt: >-
      Stage 4 awakened SSR splash art of {name}, {role}: a full-body, highly detailed illustration in an ornate,
      fully covering awakened outfit built on her motifs ({motif}): a long coat over a high-collared dress, gloves and
      boots. Flowing hair and coat tails, dramatic lighting, glowing particles, an elaborate detailed background, the
      finest detail of all her stages.

  # Bond: more casual and personal as she grows closer to you (her closeness opens each one).
  bond-1:
    size: 1024x1536
    quality: medium
    prompt: >-
      A casual snapshot of {name} off duty: an everyday outfit (an oversized cardigan or hoodie), a relaxed natural
      smile, sitting at a café table with a drink, warm afternoon daylight, like a photo taken while hanging out.
  bond-2:
    size: 1024x1536
    quality: medium
    prompt: >-
      {name} at ease with someone she trusts: cosy at-home clothes, curled up on a sofa with a snack and a game
      controller, a playful teasing expression, soft evening lamp light, a lived-in room.
  bond-3:
    size: 1024x1536
    quality: medium
    prompt: >-
      A special memory with {name}: a summer-festival yukata with patterns of {motif}, fireworks in the night sky
      behind her, a bright happy blush, holding out her hand towards the viewer, sparkling and warm.

  # Her mood faces (mneme-llm's mood: happy is great or good, calm ok, worried, sad): round faces for the pages,
  # shown small and cropped to a circle.
  mood-happy:
    size: 1024x1024
    quality: medium
    prompt: >-
      A round face icon of {name}: head and shoulders, her face centred and filling most of the square, beaming with
      a bright open smile, sparkling eyes and a light blush, on a soft plain pastel background of one colour (it is
      cropped to a circle).
  mood-calm:
    size: 1024x1024
    quality: medium
    prompt: >-
      A round face icon of {name}: head and shoulders, her face centred and filling most of the square, calm and at
      ease with a gentle small smile and soft relaxed eyes, on a soft plain pastel background of one colour (it is
      cropped to a circle).
  mood-worried:
    size: 1024x1024
    quality: medium
    prompt: >-
      A round face icon of {name}: head and shoulders, her face centred and filling most of the square, worried:
      knitted brows, a small uneasy frown, glancing aside, a little sweat drop, on a soft plain pastel background of
      one colour (it is cropped to a circle).
  mood-sad:
    size: 1024x1024
    quality: medium
    prompt: >-
      A round face icon of {name}: head and shoulders, her face centred and filling most of the square, sad: teary
      eyes, a trembling downturned mouth, her head lowered a little, on a soft plain pastel background of one colour
      (it is cropped to a circle).

  # Her models, weakest to strongest: a chibi (the Cafe's), a middle-school, a high-school, a university student.
  model-chuugakusei:
    size: 1024x1536
    quality: medium
    prompt: >-
      {name} drawn as a middle-school girl: younger proportions, a sailor-style middle-school uniform, a slightly
      shy eager expression, a simple classroom background, waist-up.
  model-koukousei:
    size: 1024x1536
    quality: medium
    prompt: >-
      {name} drawn as a high-school girl: a smart blazer uniform with a ribbon, a confident capable expression, a
      school hallway in soft light, waist-up.
  model-daigakusei:
    size: 1024x1536
    quality: medium
    prompt: >-
      {name} drawn as a university student: stylish grown-up casual clothes, a mature composed expression, books
      under her arm, a sunny campus courtyard, waist-up.

# Which of her models is which: the weakest a chibi, the strongest a high-school or university student. A model
# drawn as `chibi` shows her chibi; the others their `model-<tier>` picture.
ladders:
  gpt: {gpt-6-luna: chibi, gpt-6.1-sol: koukousei}
  claude: {claude-haiku-5-5: chibi, claude-sonnet-5-5: chuugakusei, claude-opus-5-5: koukousei, claude-fable-5-1: daigakusei}
  deepseek: {deepseek-flash: chibi, deepseek-v4-pro: koukousei}
  gemini: {gemini-3.8-flash: chibi, gemini-3.8-pro: koukousei}
  grok: {grok-4-fast: chibi, grok-4: koukousei}
