# Assistant engine settings. Copy to config.yml (git-ignored); extension_config.assistant in core.yml
# overrides it. Per-conversation options (instructions, …) belong in assignments in core.yml.
max_steps: 8
history_limit: 16
effort: low
tool_calls: true   # models that can call tools do so natively (false: JSON turns only)
diary: false       # the core diary (off: the companion module keeps what each student remembers)
